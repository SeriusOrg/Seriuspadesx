# The tables of the tower defense, read by the server at every start of
# a tower defense world, from the directory the server runs in. A line
# the file does not know how to say is skipped; a key it does not know
# is skipped; the file itself is optional - without it the guns stand
# on the defaults below, the numbers the fork grew up with. Comments
# run from # or ; to the end of the line. Sections are named in
# [brackets]; what the server reads today is [turrets], [economy] and
# [specials].
# Values are numbers, or lists of numbers in brackets, one entry per
# sentry level, level 1 to 3.

[turrets]

# How far a gun's works reach, in blocks (8 foot cubes).
range = 48.0

# How often a gun looks around for a walker in reach, in seconds.
scan_interval = 0.25

# How far from the builder's own eye a block may stand to be named the
# ground of a gun, in blocks.
place_range = 8.0

# The damage of one shot, by level. Level 1 is the light SMG the base gun
# is, level 2 the MG with its heavier round, level 3 the Minigun: a level
# buys weight of round or rate of fire, never both at once.
damage = [2, 5, 5]

# The seconds between shots, by level. The Minigun alone is fast: its
# single shot is light, its rate is not.
interval = [0.17, 0.17, 0.066]

# The economy of the tower defense, the Zedcred: a kill pays it, a wave
# adds a bonus, a sentry is bought and raised with it. A new gun climbs a
# flat step by each gun the builder already stands - so the park stays
# buyable as long as the game runs - and each raising is a fixed price
# the park never touches.

[economy]

# What a kill of a grunt pays. The specials will ask more.
zedcred_per_kill = 1

# The purse a first rise opens.
zedcred_start = 24

# A wave cleared pays this plus the number of the wave.
wave_bonus_base = 10

# The first gun of a builder, before the step.
turret_price_base = 5

# By each gun the builder already stands.
turret_price_step = 2

# The fixed reach of each raising: SMG to MG, MG to Minigun.
upgrade1_price = 10
upgrade2_price = 30

# The part, in percent, of all a builder sank into a gun that the word
# taking it down returns.
turret_refund = 70

# The store: what each card asks in Zedcreds, differing from the catalogue
# the server carries when a host says so. Free means free.

[store]

price_rifle = 0
price_smg = 20
price_shotgun = 30
price_rifle_dmg1 = 25
price_rifle_dmg2 = 40
price_smg_dmg1 = 30
price_smg_dmg2 = 45
price_shotgun_dmg1 = 35
price_shotgun_dmg2 = 50
price_ammo = 5
price_grenades = 6
price_hp1 = 15
price_hp2 = 25
price_hp3 = 40
price_speed1 = 20
price_speed2 = 35
price_health = 8
price_blocks = 4
price_repair = 12
price_core_hp1 = 18
price_core_hp2 = 30
price_core_hp3 = 50
price_turret1 = 5
price_turret2 = 10
price_turret3 = 30

# The dresses, a rung a line: the rifle and the SMG climb four, their
# tier 1 the class's own starting shape, free (granted at spawn, so a
# price above zero here is a price the rung is simply bought at); the
# shotgun and the spade start at tier 2, their stock shape being their
# first rung; the grenade wears the RPG. A tier is looks AND numbers:
# the stats a class fights with climb the ladder in the code's tiers
# table - damage, magazine, pace, the spade's reach.
price_rifle_lvl1 = 0
price_rifle_lvl2 = 100
price_rifle_lvl3 = 150
price_rifle_lvl4 = 200
price_smg_lvl1 = 0
price_smg_lvl2 = 100
price_smg_lvl3 = 150
price_smg_lvl4 = 200
price_shotgun_lvl2 = 60
price_shotgun_lvl3 = 120
price_spade_lvl2 = 30
price_spade_lvl3 = 60
price_rpg = 120

# The brutes of the horde, the specials of the waves. Each name reads
# its own words: the first wave it stands in, and the Zedcred its kill
# pays over the grunt rate. A brute of the chance rolls a d100 for its
# place, the chance itself climbing chance_grow of a notch a wave; the
# rolls stand another one up from rolls_wave on, and one more every
# rolls_every waves past it. A brute of the count stands by count
# instead: one wave each every_wave - and from grow_wave on, every
# wave, one more standing each grow_every waves, held at the cap
# grows_to. The tank keeps keeps of every hurt, in percent: it stands
# all but that share of each volley. The healer walks behind a walker
# and never leads, mends the worst hurt of the walking dead within
# healer_reach blocks at the pace of a second level gun, holds the
# tank its own waves until healer_with_tank_wave and walks beside it
# from it on. The breaker walks the horde's road until it stands
# breaker_dig_range blocks off the core, and from there walks its
# own straight line to it and digs all that stands on the line, a
# stroke every breaker_stroke seconds, three wide and four high. All
# the specials stand in the tread of a grunt of the wave: a walker
# either way, only of another skin, and never a wave grown fat by
# its own specials.

[specials]

# The Spitter, the green one. Its spit is a breath of acid in an arc,
# aimed where its person stood spit_lag seconds back: the still are
# soaked where they stand, the moving walk out of the landing. The
# bolt bursts at the touch - the ground it lands on, the face of a
# wall stood on the way - and paints a green pool acid_pool blocks
# around, a zone of peril the whole acid_melt seconds it holds: the
# paint burns whoever stands their ground inside it for
# acid_to_people of a grenade hurt a beat, and the ground falls away
# a cell at a time once the clock runs out. Its teeth answer nobody:
# the band is its ground. A person walking in under the range rides
# a plain walk back out to it, and a breath a wall shuts out walks
# the spitter only as much road as the line it owes. The arc rides at
# spit_speed blocks a second - slower rides climb higher, for a
# stand-off asks its seconds (thirty blocks at ten a second ride
# three of them, topping some thirty-six) - and a breath leaves the
# brute every spit_every seconds. It stands every wave from
# spitter_first_wave, one more standing each spitter_grow_every waves
# from spitter_grow_wave, held at spitter_grows_to when it says one.
spitter_first_wave = 3
spitter_every_wave = 0
spitter_grow_wave = 4
spitter_grow_every = 1
spitter_grows_to = 0
spitter_bounty = 5
spitter_spit_every = 2.5
spitter_spit_range = 30
spitter_spit_min = 6
spitter_spit_lag = 0.5
spitter_spit_speed = 10.0
spitter_acid_to_people = 0.15
spitter_acid_melt = 5.0
spitter_acid_pool = 1

# The Tank, the blue one, in the ZombieTank set. It walks the grunts
# walk, in their packs, in the tread of the grunt it stands for - only
# a tenth of every volley ever lands, and one more of it every wave
# from the third, without end.
tank_first_wave = 3
tank_grow_wave = 3
tank_grow_every = 1
tank_keeps = 10
tank_bounty = 10

# The Healer, the purple one: a walker of the pack that never leads,
# mending the walking dead around it. It stands every wave from
# healer_first_wave, one more standing each healer_grow_every waves
# from healer_grow_wave - half again as many over a stretch of waves,
# held at healer_grows_to when it says one.
healer_first_wave = 10
healer_grow_wave = 10
healer_grow_every = 3
healer_grows_to = 0
healer_bounty = 8
healer_with_tank_wave = 20

# The reach of the mender, in blocks; the pace of the breaker
# stroke, in seconds; and the band around the core, in blocks, where
# the breaker leaves the horde's road for its own straight line.
healer_reach = 20.0
breaker_stroke = 1.5
breaker_dig_range = 50.0

# The Leaper, the red one: every one of them is born a hunter of the
# living and walks its own chase, never with the pack; the share in
# leaper_hunt_chance may soften it back.
leaper_first_wave = 7
leaper_hunt_chance = 100
leaper_chance = 40
leaper_chance_grow = 4
leaper_rolls_wave = 10
leaper_rolls_every = 3
leaper_bounty = 6
# The hunters leap: the chase walks the map until the person stands
# about leaper_leap_country blocks off, then a flight lands on the
# ground of a perch that stands above the person, half a second to
# one of squatting coil - leaper_leap_hold holds the ceiling of the
# wait - and the pounce itself, a homing flight at the person.
leaper_leap_every = 8.0
leaper_leap_hold = 1.0
leaper_leap_perch = 30
leaper_leap_country = 50

# The Breaker, the yellow one, on its straight road to the core.
breaker_first_wave = 8
breaker_chance = 60
breaker_bounty = 7

# The Boomer wave: a round the boomers own, once every boomer_wave_every
# waves from boomer_wave_first, each tread of it a pink bladder and its
# dead thinned to boomer_wave_scale percent of the ramp. The wick lights
# on a person in boomer_arm, a wall stood against, or the core itself,
# wears a dark orange flare, burns boomer_fuse seconds under it, and
# blinks a shade against its dim mate - skin, highlight and the head
# itself, the skull pulsing at the beat - plain red for the last
# boomer_red_lead of them, quicker and quicker, then bursts with the
# radius of a grenade - the same reach, the same fall with distance,
# the same walls between - its own side as much as the people's, and
# boomer_core_hurt to the core it brims against.
boomer_wave_first = 6
boomer_wave_every = 5
boomer_wave_scale = 60
boomer_fuse = 8.0
boomer_red_lead = 5.0
boomer_arm = 10.0
boomer_core_hurt = 30
# Within boomer_chase blocks of a person the road turns from the core
# to them: the chase walks the hunt's own field at their ground, for
# the wick it lights at their feet is the whole tooth it carries.
boomer_chase = 30.0
